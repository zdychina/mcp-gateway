<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('网关列表')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">网关列表</h1>
    <button class="btn btn-primary" type="button"
            onclick="document.getElementById('create-panel').hidden = false">
      创建网关
    </button>
  </div>

  <!-- 创建表单 -->
  <div class="card mb-4" id="create-panel" hidden>
    <div class="card-header">创建网关</div>
    <div class="card-body">
      <form id="create-form" class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="create-name">名称</label>
          <input class="form-control" id="create-name" name="name" maxlength="64" required>
          <div class="form-text">1–64 个字符</div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="create-slug">标识 slug</label>
          <input class="form-control" id="create-slug" name="slug" maxlength="64"
                 pattern="[A-Za-z0-9_-]{1,64}" required>
          <div class="form-text">字母、数字、短横线和下划线；决定 Agent 的 MCP 地址</div>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="create-description">描述（可选）</label>
          <input class="form-control" id="create-description" name="description" maxlength="4000">
          <div class="form-text">会作为 instructions 传给 Agent</div>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">创建</button>
          <button class="btn btn-link" type="button"
                  onclick="document.getElementById('create-panel').hidden = true">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 需求 FR-05.3：令牌只完整显示一次，创建后必须让操作人当场存走 -->
  <div id="token-panel" class="card border-warning mb-4" hidden>
    <div class="card-header bg-warning-subtle">访问令牌</div>
    <div class="card-body">
      <p class="mb-2">
        <strong>这是唯一一次完整显示该令牌。</strong>
        现在复制保存；离开本页后只能通过轮换生成新的令牌。
      </p>
      <div class="input-group">
        <input class="form-control font-monospace" id="token-value" readonly>
        <button class="btn btn-outline-secondary" type="button"
                data-copy-target="token-value">复制</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th>名称</th>
          <th>slug</th>
          <th>状态</th>
          <th class="text-end">子 MCP</th>
          <th class="text-end">工具</th>
          <th>更新时间</th>
          <th class="text-end">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="gw : ${gateways}">
          <td>
            <a th:href="@{/ui/gateways/{id}(id=${gw.id})}" th:text="${gw.name}">名称</a>
            <div class="small text-muted" th:if="${gw.description}" th:text="${gw.description}"></div>
          </td>
          <td class="font-monospace small" th:text="${gw.slug}">slug</td>
          <td>
            <span class="badge" th:text="${gw.status}"
                  th:classappend="${gw.status.name() == 'READY'} ? 'text-bg-success'
                                : (${gw.status.name() == 'DEGRADED'} ? 'text-bg-warning'
                                : (${gw.status.name() == 'UNAVAILABLE'} ? 'text-bg-danger'
                                : 'text-bg-secondary'))">状态</span>
          </td>
          <td class="text-end" th:text="${gw.downstreamCount}">0</td>
          <td class="text-end" th:text="${gw.toolCount}">0</td>
          <td class="small text-muted" th:text="${#temporals.format(gw.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-secondary"
               th:href="@{/ui/gateways/{id}(id=${gw.id})}">详情</a>
            <button class="btn btn-sm btn-outline-danger" type="button"
                    th:attr="data-gateway-id=${gw.id},data-gateway-name=${gw.name}"
                    data-action="delete-gateway">删除</button>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(gateways)}">
          <td colspan="7" class="text-center text-muted py-4">
            还没有网关。点右上角"创建网关"开始。
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
