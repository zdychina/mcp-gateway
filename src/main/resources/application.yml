spring:
  application:
    name: mcp-gateway

  datasource:
    # H2 文件库，单机单进程部署（需求 14）。
    url: jdbc:h2:file:${MCP_GATEWAY_DB_PATH:./data/mcp-gateway};AUTO_SERVER=FALSE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${MCP_GATEWAY_DB_USER:sa}
    password: ${MCP_GATEWAY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      pool-name: mcp-gateway-pool

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: always

server:
  servlet:
    # 挂在子路径下部署时的前缀，例如 /kbmcp。默认空 —— 应用占据整个根路径。
    #
    # 设了它之后 /ui /api /mcp /app 会整体搬到前缀下面，但 Java 侧一行都不用改：
    # 容器在交给 Spring 之前就把前缀剥掉了，SecurityConfig 的路径匹配、/mcp/* 的
    # servlet 注册、redirect:/ui/gateways 看到的仍然是不带前缀的地址。
    #
    # 两件必须跟着一起做的事：
    #   - 反向代理转发时**不要**剥前缀（nginx 里 proxy_pass 结尾不带路径），剥两次就没了；
    #   - 前端产物要用同一个前缀构建（VITE_BASE_PATH，见 frontend/vite.config.ts）——
    #     index.html 里的资源地址是绝对路径，前缀对不上就是一片 404。
    # 详见 DEPLOY.md 的「挂在子路径下」。
    context-path: ${MCP_GATEWAY_CONTEXT_PATH:}
    # 管理端登录会话（需求 12.8）。会话存在服务端内存里，Cookie 只带一个猜不到的会话 ID。
    session:
      # 闲置超时。管理端是低频操作界面，短一点没有代价。
      timeout: 30m
      cookie:
        # JS 读不到会话 ID —— XSS 也就偷不走登录态。
        http-only: true
        # 管理端没有任何"从外站跳进来"的正当场景，Strict 无副作用，
        # 且它是当前挡住 CSRF 的主力（CSRF 令牌是第二道）。
        same-site: strict
        # 默认 false：默认部署是 localhost 明文 HTTP，写死 true 会让 Cookie 根本不下发、
        # 登录进不去。放在做了 TLS 的反向代理后面时必须显式设为 true。
        secure: ${MCP_GATEWAY_COOKIE_SECURE:false}
    encoding:
      charset: UTF-8
      # 静态资源（app.js / app.css）里有中文注释与文案。Spring 默认以 text/javascript
      # 不带 charset 返回，浏览器只能回退到文档编码去猜。强制声明 UTF-8 去掉这个依赖。
      force-response: true
  tomcat:
    # 重定向发相对地址（Location: /ui/gateways），而不是绝对地址。
    #
    # 默认的绝对地址是由 Tomcat 自己那条连接拼出来的，而反向代理与它之间几乎总是明文
    # HTTP —— 于是 https://host/ 的请求会收到 Location: http://host/ui/gateways，
    # 浏览器跳去 80 端口，多数部署那里根本没有监听。子路径部署下更明显：
    # 那是打开应用的第一跳，一跳就出了本站。
    #
    # 为什么不是读 X-Forwarded-Proto（server.forward-headers-strategy）：那要求信任
    # 客户端可伪造的请求头，而本项目在 FR-05.1 上刚刚拒绝过这件事。相对地址由浏览器
    # 按当前地址栏解析，一个头都不用信，且在任何前缀、任何协议下都对。
    use-relative-redirects: true
  # 需求 12.6：本地部署默认只监听 localhost。内网部署需显式覆盖 server.address。
  # 管理端已有登录（见 mcp-gateway.security.admin），绑到内网地址成为可选项 ——
  # 但纵深防御不因为多了一道就撤掉前一道，默认值保持回环。
  address: ${MCP_GATEWAY_BIND_ADDRESS:127.0.0.1}
  port: ${MCP_GATEWAY_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

mcp-gateway:
  # 需求 FR-05.1：Agent 接入 JSON 里的 baseUrl 只能来自部署配置，
  # 绝不允许根据 Host / X-Forwarded-* 等不可信请求头拼接。
  base-url: ${MCP_GATEWAY_BASE_URL:http://127.0.0.1:8080}

  security:
    # 需求 12.1 / 12.2：主密钥只能来自环境变量，代码和配置文件里不得有默认值。
    # Base64 编码的 32 字节密钥，缺失或长度不对时应用启动失败。
    master-key: ${MCP_GATEWAY_MASTER_KEY:}
    # 需求 12.6：允许的 Origin，逗号分隔；为空表示只接受不带 Origin 的请求。
    allowed-origins: ${MCP_GATEWAY_ALLOWED_ORIGINS:}
    # 与 server.servlet.session.cookie.secure 读同一个环境变量，管的是 CSRF 令牌 Cookie。
    cookie-secure: ${MCP_GATEWAY_COOKIE_SECURE:false}

    # 需求 12.8：管理端的唯一账号。与主密钥同样的处理 —— 口令只能来自环境变量，
    # 这里不得有默认值，缺失或短于 8 位时应用启动失败（见 AdminAccount）。
    admin:
      username: ${MCP_GATEWAY_ADMIN_USERNAME:admin}
      password: ${MCP_GATEWAY_ADMIN_PASSWORD:}

  downstream:
    # 需求 6.6.5：默认下游调用超时 30 秒，可通过配置调整。
    call-timeout: 30s
    connect-timeout: 10s
    # 需求 12.9：下游响应体大小上限，默认 1 MiB。
    max-response-size: 1048576
    # 跳过下游 TLS 证书与主机名校验。默认关闭，只有内网自签证书且拿不到根证书时才打开 ——
    # 打开之后下游凭证会在一条无法验证对方身份的连接上传输。详见 SECURITY.md。
    insecure-skip-tls-verify: ${MCP_GATEWAY_DOWNSTREAM_INSECURE_SKIP_TLS_VERIFY:false}

  server:
    # 需求 12.9：Agent 请求体大小上限，默认 1 MiB。
    max-request-size: 1048576
    # 需求 6.2.1：每个网关最多 3 个子 MCP。
    max-downstream-per-gateway: 3

management:
  endpoints:
    web:
      exposure:
        # 除健康检查外不放开任何 actuator 端点（需求 12.8）。健康检查是容器 healthcheck
        # 的依赖，因此也是 SecurityConfig 里唯一公开的非 UI 路径。
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.mcpgateway: INFO
    io.modelcontextprotocol: INFO
